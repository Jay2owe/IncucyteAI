name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Windows, because that is what this package is. The login step needs the
    # vendor .NET assembly through pythonnet, the scheduled task is
    # `schtasks`, and the desktop app is Tk on this machine - so a green
    # Ubuntu run would be a promise the package does not make.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # `figure` as well as `dev`: matplotlib is what a .png or .pdf protocol
      # drawing needs, and an extra CI does not install is a half of the
      # package nothing tests.
      - run: python -m pip install -e ".[dev,figure]"
      - run: python -m pytest -q
