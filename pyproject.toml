[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyIncucyte"
version = "0.3.0"
description = "Download Incucyte live-cell imaging TIFFs from Python, a CLI, or a desktop app."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Jamie Malcolm" }
]
keywords = [
    "incucyte",
    "pyincucyte",
    "microscopy",
    "live-cell imaging",
    "imagej",
    "tiff",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "tifffile>=2023.7.10",
    # Only the login step needs the vendor .NET assembly, and only on Windows.
    "pythonnet>=3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Only a .png or .pdf protocol drawing needs it; the .svg needs nothing, and
# the packaged desktop app excludes matplotlib outright.
figure = [
    "matplotlib>=3.7",
]
dev = [
    "build>=1.2",
    "twine>=5.0",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/Jay2owe/PyIncucyte"
Source = "https://github.com/Jay2owe/PyIncucyte"
Issues = "https://github.com/Jay2owe/PyIncucyte/issues"

[project.scripts]
pyincucyte = "pyincucyte.cli:main"
# The desktop app is also `pyincucyte gui`; this is the shortcut-friendly name.
pyincucyte-gui = "pyincucyte.gui:main"

[tool.setuptools.packages.find]
include = ["pyincucyte*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
